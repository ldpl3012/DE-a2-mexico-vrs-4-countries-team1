<svg xmlns="http://www.w3.org/2000/svg" width="900" height="158" viewBox="0 0 900 158" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ConectaMapa pipeline (compact)</title>
  <desc id="d">Phenomenon, capture, data, analysis, decision and action, with a feedback loop from action to analysis. Compact version for the two-page brief.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#655D7A"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9508A"/></marker>
  </defs>
  <rect width="900" height="158" fill="#FFFFFF"/>
  <!-- boxes: x = 2 + i*151, width 131 -->
  <g font-size="13.5" fill="#211A35">
    <rect x="2" y="2" width="131" height="96" rx="8" fill="#F5F2FB" stroke="#E4DEF2"/>
    <path d="M2,10 a8,8 0 0 1 8,-8 h115 a8,8 0 0 1 8,8 v22 h-131 z" fill="#4B2E83"/>
    <text x="67.5" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1 Phenomenon</text>
    <text x="10" y="56">Unmet demand</text><text x="10" y="75">invisible to ISPs</text>

    <rect x="153" y="2" width="131" height="96" rx="8" fill="#F5F2FB" stroke="#E4DEF2"/>
    <path d="M153,10 a8,8 0 0 1 8,-8 h115 a8,8 0 0 1 8,8 v22 h-131 z" fill="#4B2E83"/>
    <text x="218.5" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2 Capture</text>
    <text x="161" y="56">Web, WhatsApp,</text><text x="161" y="75">SMS, field agents</text>

    <rect x="304" y="2" width="131" height="96" rx="8" fill="#F5F2FB" stroke="#E4DEF2"/>
    <path d="M304,10 a8,8 0 0 1 8,-8 h115 a8,8 0 0 1 8,8 v22 h-131 z" fill="#4B2E83"/>
    <text x="369.5" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3 Data</text>
    <text x="312" y="56">Demand records</text><text x="312" y="75">+ census, speeds</text>

    <rect x="455" y="2" width="131" height="96" rx="8" fill="#F5F2FB" stroke="#E4DEF2"/>
    <path d="M455,10 a8,8 0 0 1 8,-8 h115 a8,8 0 0 1 8,8 v22 h-131 z" fill="#4B2E83"/>
    <text x="520.5" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4 Analysis</text>
    <text x="463" y="56">Demand density,</text><text x="463" y="75">take-up, payback</text>

    <rect x="606" y="2" width="131" height="96" rx="8" fill="#FDF1F6" stroke="#E9AFC9"/>
    <path d="M606,10 a8,8 0 0 1 8,-8 h115 a8,8 0 0 1 8,8 v22 h-131 z" fill="#C9508A"/>
    <text x="671.5" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">5 Decision</text>
    <text x="614" y="56">Next locality</text><text x="614" y="75">and its price</text>

    <rect x="757" y="2" width="131" height="96" rx="8" fill="#FDF1F6" stroke="#E9AFC9"/>
    <path d="M757,10 a8,8 0 0 1 8,-8 h115 a8,8 0 0 1 8,8 v22 h-131 z" fill="#C9508A"/>
    <text x="822.5" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">6 Action</text>
    <text x="765" y="56">Build, pre-sell,</text><text x="765" y="75">install</text>
  </g>
  <g stroke="#655D7A" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="135" y1="55" x2="151" y2="55"/><line x1="286" y1="55" x2="302" y2="55"/><line x1="437" y1="55" x2="453" y2="55"/>
    <line x1="588" y1="55" x2="604" y2="55"/><line x1="739" y1="55" x2="755" y2="55"/>
  </g>
  <path d="M822.5,100 V126 H520.5 V104" stroke="#C9508A" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ap)"/>
  <text x="671.5" y="148" text-anchor="middle" font-size="13" font-style="italic" fill="#C9508A">Actual subscriptions recalibrate the model</text>
</svg>
